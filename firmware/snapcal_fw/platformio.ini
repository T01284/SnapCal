; SnapCal NBC firmware (fork of ESPARGOS/esp-sdr, see UPSTREAM_COMMIT).
; Built with the locally installed PlatformIO espressif32@6.13.0 = ESP-IDF 5.5.3.
; Upstream pins an ESP-IDF v6 dev commit; record any behaviour difference in docs/.

[platformio]
src_dir = main
default_envs = esp32s3_devkit

[env]
platform = espressif32@6.13.0
framework = espidf
monitor_speed = 2000000
upload_speed = 921600
; sdkconfig.defaults + sdkconfig.defaults.<target> are applied by ESP-IDF itself.
board_upload.flash_size = 2MB
board_build.flash_mode = dio
extra_scripts = pre:tools/pio_version.py

; Bring-up board on hand (PCB antenna, native USB Serial/JTAG). Over-the-air only.
[env:esp32s3_devkit]
board = esp32-s3-devkitc-1
upload_port = COM31
monitor_port = COM31

; Formal measurement boards: ESP32-S3-WROOM-1U (IPEX). Pin the port per board.
[env:esp32s3_wroom1u]
board = esp32-s3-devkitc-1

; Same firmware with the 16 MB flash declared and a SNAPLOG data partition, for host-free
; captures inside the enclosure (battery power, no cable). Erases the log area on LOG ARM.
[env:esp32s3_wroom1u_snaplog]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions-snaplog.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.snaplog"

; ESP32-C5 boards (IPEX, 2.4/5 GHz). espressif32@6.13.0 has no C5 board definition, so this env
; uses the locally installed pioarduino platform but links the same ESP-IDF 5.5.3 package.
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform_packages = framework-espidf @ symlink://${sysenv.USERPROFILE}/.platformio/packages/framework-espidf
board = esp32-c5-devkitc-1
